<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mijn account — BINC Klantenportaal</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0948/5235/0296/files/FAICON_BINC.png?v=1765981771"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --red:#c0392b;
  --red2:#e74c3c;
  --white:#fff;
  --dim:rgba(255,255,255,.58);
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --font-ui:'Rajdhani',sans-serif;
}
html{cursor:none}
body{background:#000;color:#fff;font-family:var(--font-body);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
#cur,#cur-ring{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference}
#cur{width:8px;height:8px;background:#fff;transform:translate(-50%,-50%)}
#cur-ring{width:34px;height:34px;border:1.5px solid rgba(255,255,255,.45);transform:translate(-50%,-50%);transition:width .3s,height .3s}
body:has(a:hover) #cur-ring,body:has(button:hover) #cur-ring{width:52px;height:52px}
::selection{background:var(--red);color:#fff}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;transition:.4s;background:rgba(0,0,0,.88);backdrop-filter:blur(20px)}
.nav-logo{display:flex;align-items:center;text-decoration:none}
.nav-logo img{height:38px;width:auto;object-fit:contain}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{font-family:var(--font-ui);font-size:.78rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:8px 16px;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:4px;left:16px;right:16px;height:1px;background:rgba(192,57,43,.85);transform:scaleX(0);transform-origin:left;transition:.3s}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-cta{color:#fff!important;background:var(--red)!important;padding:10px 26px!important;font-weight:700;border-radius:2px}
.nav-cta::after{display:none!important}
.nav-cta:hover{background:var(--red2)!important;color:#fff!important}
.nav-right{display:flex;align-items:center;gap:0}
.nav-right .lang-switch{display:none}
.nav-hamburger{display:none}

/* ── LANG SWITCH ── */
.lang-switch{display:flex;align-items:center;gap:0;border:1px solid rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin-left:18px;flex-shrink:0}
.lang-btn{font-family:var(--font-ui);font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.42);background:transparent;border:none;padding:6px 11px;cursor:pointer;transition:.2s;line-height:1}
.lang-btn.active{background:var(--red);color:#fff}
.lang-btn:hover:not(.active){color:#fff;background:rgba(255,255,255,.08)}

/* ── LANG FAB ── */
.lang-fab{
  display:flex;align-items:center;gap:0;border:1px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden;
  position:fixed;bottom:28px;right:28px;z-index:600;
  box-shadow:0 4px 24px rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(0,0,0,.72);
}
.lang-fab .lang-btn{font-size:.7rem;padding:9px 15px}

.drawer-lang{display:flex;align-items:center;justify-content:center;gap:0;border:1px solid rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin-top:24px}
.drawer-lang .lang-btn{font-size:.8rem;padding:10px 22px}

@media(min-width:1001px){
  .nav-links{margin-left:auto;margin-right:20px}
}

/* MOBILE DRAWER */
.mobile-nav-drawer{display:none;position:fixed;inset:0;z-index:490;background:rgba(0,0,0,.97);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);flex-direction:column;align-items:center;justify-content:center;padding:100px 6vw 60px;transform:translateY(-100%);transition:transform .42s cubic-bezier(.22,1,.36,1);pointer-events:none;opacity:0}
.mobile-nav-drawer.open{transform:translateY(0);pointer-events:auto;opacity:1}
.mobile-nav-drawer a{font-family:var(--font-display);font-size:clamp(2.4rem,10vw,3.6rem);font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.62);text-decoration:none;line-height:1.1;display:block;padding:14px 0;width:100%;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);transition:color .2s}
.mobile-nav-drawer a:hover{color:#fff}
.mobile-nav-drawer a.drawer-cta{color:#fff;background:var(--red);border-radius:4px;margin-top:24px;border-bottom:none;font-size:clamp(1.3rem,5vw,1.8rem);padding:16px 0;letter-spacing:.14em}
.mobile-nav-drawer a.drawer-cta:hover{background:var(--red2)}

/* ══ KLANTENPORTAAL ══ */
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:150px 6vw 90px;overflow:hidden}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(192,57,43,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(192,57,43,.05) 1px,transparent 1px);background-size:90px 90px;opacity:.55;animation:gridScroll 25s linear infinite}
@keyframes gridScroll{from{transform:translateY(0)}to{transform:translateY(90px)}}
.orb{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;background:rgba(192,57,43,.10);width:520px;height:520px;top:-10%;right:6%}
@keyframes riseUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.auth-wrap{position:relative;z-index:5;width:100%;max-width:520px;opacity:0;animation:riseUp .9s .1s forwards}
.auth-eyebrow{font-family:var(--font-ui);font-size:.78rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.auth-eyebrow::before{content:'';width:34px;height:1px;background:var(--red)}
.auth-title{font-family:var(--font-display);font-weight:900;font-size:clamp(2.6rem,7vw,4.2rem);line-height:.95;text-transform:uppercase;margin-bottom:16px}
.auth-title .acc{color:var(--red)}
.auth-sub{font-size:1.02rem;line-height:1.8;color:rgba(255,255,255,.68);font-weight:300;margin-bottom:30px}
.auth-sub strong{color:#fff;font-weight:600;word-break:break-all}
.auth-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--red);border-radius:4px;padding:34px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.auth-form{display:flex;flex-direction:column;gap:20px}
.field-label{display:block;font-family:var(--font-ui);font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.field-input{width:100%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:2px;color:#fff;font-family:var(--font-body);font-size:1rem;padding:15px 16px;outline:none;transition:.25s;cursor:text}
.field-input::placeholder{color:rgba(255,255,255,.32)}
.field-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.22)}
.btn-red,.btn-outline{font-family:var(--font-ui);font-size:.82rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;display:inline-block;text-align:center;transition:.25s;cursor:pointer}
.btn-red{color:#fff;background:var(--red);border:none;padding:17px 40px;border-radius:2px;width:100%}
.btn-red:hover{background:var(--red2)}
.btn-red:disabled{opacity:.55;cursor:not-allowed}
.btn-outline{color:#fff;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.24);padding:16px 40px;border-radius:2px}
.btn-outline:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}
.link-btn{background:none;border:none;font-family:var(--font-ui);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);cursor:pointer;padding:6px 0;transition:.2s}
.link-btn:hover:not(:disabled){color:#fff}
.link-btn:disabled{opacity:.4;cursor:not-allowed}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.msg-box{padding:14px 16px;border-radius:2px;font-size:.92rem;line-height:1.6;margin-bottom:20px;border:1px solid transparent}
.msg-error{background:rgba(192,57,43,.14);border-color:rgba(231,76,60,.45);color:#ffb4aa}
.msg-info{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.88)}
.hidden{display:none!important}
.code-row{display:flex;gap:12px;justify-content:center}
.code-box{width:66px;height:78px;text-align:center;font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:2px;outline:none;transition:.25s;cursor:text}
.code-box:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.22)}
.code-row.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.auth-foot{margin-top:24px;font-size:.92rem;color:rgba(255,255,255,.5);font-weight:300}
.auth-foot a{color:#fff;text-decoration:none;border-bottom:1px solid var(--red);padding-bottom:1px}
.auth-foot a:hover{color:var(--red)}

/* portaal */
main.portal-main{align-items:flex-start}
.portal-wrap{position:relative;z-index:5;width:100%;max-width:920px;opacity:0;animation:riseUp .9s .1s forwards}
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--red);border-radius:4px;padding:30px;margin-bottom:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{font-family:var(--font-display);font-size:1.9rem;font-weight:800;text-transform:uppercase;line-height:1.05}
.card .tab{font-family:var(--font-ui);font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin:6px 0 20px}
.card .empty{color:rgba(255,255,255,.6);font-weight:300;margin-top:10px}
dl{display:grid;grid-template-columns:minmax(130px,230px) 1fr}
dt,dd{padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:.98rem}
dt{font-family:var(--font-ui);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);padding-right:16px;padding-top:15px}
dd{color:#fff;font-weight:400;word-break:break-word}
dl>:nth-child(1),dl>:nth-child(2){border-top:none}
.state{text-align:center;padding:50px 20px;color:rgba(255,255,255,.6);font-weight:300}
.spinner{width:28px;height:28px;margin:0 auto 14px;border:3px solid rgba(192,57,43,.25);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.portal-actions{margin-top:10px}

/* FOOTER */
footer{background:#000;border-top:1px solid rgba(192,57,43,.16);padding:60px 6vw 40px;display:grid;grid-template-columns:1.1fr 2fr;gap:60px;align-items:start;position:relative;z-index:5}
.ft-brand{display:flex;flex-direction:column;gap:24px}
.ft-logo{width:200px;opacity:.98}
.ft-socials{display:flex;align-items:center;gap:22px}
.ft-socials a{width:22px;height:22px;color:#fff;opacity:.72;transition:.2s;display:inline-flex;align-items:center;justify-content:center}
.ft-socials a:hover{color:var(--red);opacity:1;transform:translateY(-2px)}
.ft-socials svg{width:100%;height:100%;fill:currentColor}
.ft-info{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.ft-item p,.ft-item a{font-size:1rem;line-height:1.75;color:rgba(255,255,255,.74);text-decoration:none;font-weight:400}
.ft-h{font-family:var(--font-ui);font-size:.82rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(192,57,43,1);margin-bottom:12px}
.ft-item a:hover{color:var(--red)}

@media(max-width:1000px){
  html,body{cursor:auto}
  #cur,#cur-ring{display:none}
  .lang-fab{display:none}
  .nav-right .lang-switch{display:flex}
  nav{height:70px;padding:0 5vw}
  .nav-logo img{height:32px}
  nav .nav-links{display:none}
  .nav-hamburger{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;cursor:pointer;background:none;border:none;padding:0;position:relative;z-index:510}
  .nav-hamburger span{display:block;width:26px;height:1.5px;background:#fff;border-radius:2px;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .22s,background .22s;transform-origin:center}
  .nav-hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);background:var(--red)}
  .nav-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
  .nav-hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);background:var(--red)}
  .mobile-nav-drawer{display:flex}
  main{padding:130px 6vw 70px}
  footer{grid-template-columns:1fr;gap:36px;padding:48px 6vw 32px}
  .ft-brand{align-items:center;text-align:center;gap:18px;padding-bottom:32px;border-bottom:1px solid rgba(192,57,43,.12);margin-bottom:8px}
  .ft-logo{width:min(180px,55vw);margin:0 auto}
  .ft-socials{justify-content:center}
  .ft-info{grid-template-columns:1fr;gap:18px;text-align:center}
}
@media(max-width:1000px){
  .auth-card{padding:28px 22px}
}
@media(max-width:560px){
  .code-box{width:56px;height:68px;font-size:2.2rem}
  .code-row{gap:9px}
  dl{grid-template-columns:1fr}
  dt{padding-bottom:0}
  dd{border-top:none;padding-top:2px}
  dl>:nth-child(1){border-top:none}
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════
   TRANSLATIONS (zelfde sleutels & binc_lang opslag als de rest van de site)
══════════════════════════════════════════════════ */
const TRANSLATIONS = {
  nl: {
    'nav.retail': 'Retail',
    'nav.horeca': 'Horeca',
    'nav.events': 'Evenementen',
    'nav.team':   'Ons Team',
    'nav.jobs':   'Werken bij',
    'nav.login':  'Inloggen',
    'nav.logout': 'Uitloggen',
    'nav.cta':    'Samenwerken',

let currentLang = localStorage.getItem('binc_lang') || 'nl';
function t(key){ return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS['nl'][key] || key; }
function applyLang(lang){
  currentLang = lang;
  localStorage.setItem('binc_lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.lang === lang); });
}
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => { applyLang(btn.dataset.lang); toggleDrawer(false); });
});

/* CURSOR */
const cur  = document.getElementById('cur');
const ring = document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
(function animRing(){ rx+=(mx-rx)*.11; ry+=(my-ry)*.11; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(animRing); })();

/* MOBILE NAV DRAWER */
const hamburger = document.getElementById('navHamburger');
const drawer    = document.getElementById('mobileDrawer');
function toggleDrawer(open){
  hamburger.classList.toggle('open', open);
  drawer.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
hamburger.addEventListener('click', () => toggleDrawer(!drawer.classList.contains('open')));
drawer.querySelectorAll('a').forEach(l => l.addEventListener('click', () => toggleDrawer(false)));

/* ══════════════ PORTAAL ══════════════ */
const API_BASE  = 'https://server-medewerker-kpi.onrender.com';
const TOKEN_KEY = 'klantToken';
const $ = id => document.getElementById(id);
let token = null;
try { token = sessionStorage.getItem(TOKEN_KEY); } catch (_) {}

function logout(){
  try { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem('klantData'); } catch (_) {}
  location.replace('inloggen.html');
}
['logoutBtn','navLogout','drawerLogout'].forEach(id => { const el = $(id); if (el) el.addEventListener('click', e => { e.preventDefault(); logout(); }); });
if (!token) logout();

let lastKlant = null, lastError = null;
function renderAll(){
  const box = $('content'); box.innerHTML = '';
  if (lastError) { $('state').classList.remove('hidden'); $('state').textContent = t('portal.failed') + ' ' + lastError; return; }
  if (!lastKlant) return;
  const klant = lastKlant;
  let who = klant.email || '';
  if (klant.laatstIngelogd) who += ' \u00b7 ' + t('portal.loggedin') + ' ' + klant.laatstIngelogd;
  $('whoLine').textContent = who;

  (klant.filialen || []).forEach(f => {
    if (!f.gevonden) {
      const c = document.createElement('div'); c.className = 'card';
      const h = document.createElement('h2'); h.textContent = t('portal.filiaal') + ' ' + f.filiaalId;
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('portal.empty');
      c.append(h, p); box.appendChild(c); return;
    }
    f.bronnen.forEach(b => {
      const c = document.createElement('div'); c.className = 'card';
      const naam = (b.velden.find(v => /^(naam|filiaal ?naam|bedrijfsnaam|winkel)/i.test(v.label)) || {}).waarde;
      const h = document.createElement('h2'); h.textContent = naam || (t('portal.filiaal') + ' ' + f.filiaalId);
      const tab = document.createElement('div'); tab.className = 'tab'; tab.textContent = t('portal.filiaalId') + ' ' + f.filiaalId;
      const dl = document.createElement('dl');
      b.velden.forEach(v => {
        const dt = document.createElement('dt'); dt.textContent = v.label;    // textContent: nooit HTML uit de sheet uitvoeren
        const dd = document.createElement('dd'); dd.textContent = v.waarde;
        dl.append(dt, dd);
      });
      c.append(h, tab, dl); box.appendChild(c);
    });
  });
  $('state').classList.add('hidden');
}

// taalwissel: ook de dynamisch opgebouwde kaarten opnieuw tekenen
const _applyLang = applyLang;
applyLang = function(lang){ _applyLang(lang); renderAll(); };
applyLang(currentLang);

// Altijd verse gegevens ophalen; de sessie wordt hiermee ook gecontroleerd.
if (token) {
  fetch(API_BASE + '/api/klant/me', { headers: { Authorization: 'Bearer ' + token } })
    .then(async r => {
      if (r.status === 401) return logout();
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '');
      let cached = {}; try { cached = JSON.parse(sessionStorage.getItem('klantData') || '{}'); } catch (_) {}
      lastKlant = Object.assign({}, d.klant, { laatstIngelogd: cached.laatstIngelogd });
      renderAll();
    })
    .catch(e => { lastError = e.message || ''; renderAll(); });
}
</script>
