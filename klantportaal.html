<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bestelportaal — BINC B2B</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0948/5235/0296/files/FAICON_BINC.png?v=1765981771"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;
  --panel:#121214;
  --panel2:#18181b;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --red:#c0392b;
  --red2:#e74c3c;
  --gold:#d6b45a;
  --ok:#3fb27f;
  --text:#f4f4f5;
  --dim:rgba(255,255,255,.62);
  --faint:rgba(255,255,255,.4);
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --font-ui:'Rajdhani',sans-serif;
  --top:60px;
  --side:240px;
  --cart:380px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font:inherit;color:var(--text)}
a{color:inherit}
::selection{background:var(--red);color:#fff}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}

/* ── TOPBAR ── */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(10,10,11,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-logo img{height:26px;display:block}
.top-tag{font-family:var(--font-ui);font-weight:700;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--red2);padding-left:14px;border-left:1px solid var(--line2);white-space:nowrap}
.top-space{flex:1}
.who{font-size:.85rem;color:var(--dim);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ghost{font-family:var(--font-ui);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 12px;border:1px solid var(--line2);border-radius:3px;text-decoration:none;white-space:nowrap;transition:.15s;display:inline-block}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.05)}
.lang{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.lang button{font-family:var(--font-ui);font-weight:700;font-size:.7rem;letter-spacing:.16em;padding:7px 10px;color:var(--faint);line-height:1}
.lang button.on{background:var(--red);color:#fff}

/* ── SHELL ── */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);padding-top:var(--top);min-height:100vh}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:4px;font-family:var(--font-ui);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:.15s;position:relative;white-space:nowrap}
.nav-i svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-i.on{color:#fff;background:rgba(192,57,43,.16);box-shadow:inset 3px 0 0 var(--red)}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:.7rem;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px;letter-spacing:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
/* Hulp + uitloggen: bewust rustig */
.help{padding:0 14px 4px;border-top:1px solid var(--line);padding-top:14px}
.help-h{font-size:.8rem;color:var(--faint);margin-bottom:6px}
.help-l{display:flex;align-items:center;gap:9px;color:var(--dim);text-decoration:none;font-size:.82rem;padding:4px 0;overflow:hidden}
.help-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help-l svg,.logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.help-l:hover{color:#fff}
.logout{display:flex;align-items:center;gap:9px;width:100%;padding:8px 14px;border-radius:4px;color:var(--faint);font-size:.82rem;transition:.15s}
.logout:hover{color:#fff;background:rgba(255,255,255,.05)}
.main{min-width:0}
.view{display:none}.view.on{display:block}

/* ── BESTELLEN ── */
.order-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--cart);align-items:start}
.catalog{padding:28px 32px 90px;min-width:0;max-width:980px}
.page-h{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(1.9rem,3vw,2.5rem);line-height:1;letter-spacing:.01em}
.page-h .acc{color:var(--red)}
.page-sub{color:var(--dim);margin:8px 0 24px;max-width:60ch}

/* merk-tegels */
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.brand{position:relative;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;transition:border-color .15s,background .15s;min-width:0}
.brand:hover{border-color:var(--line2);background:var(--panel2)}
.brand.on{border-color:var(--red);background:linear-gradient(180deg,rgba(192,57,43,.16),var(--panel));box-shadow:inset 0 -3px 0 var(--red)}
.brand-art{flex:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--tone,#333);overflow:hidden;position:relative}
.brand-art img{width:100%;height:100%;object-fit:contain;padding:3px;position:relative;z-index:1}
.brand-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),transparent 60%)}
.brand-art b{position:relative;z-index:1;font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.brand-t{min-width:0}
.brand-n{display:block;font-family:var(--font-display);font-weight:700;font-size:1.08rem;line-height:1.05;overflow-wrap:normal;word-break:normal}
.brand-m{display:block;font-size:.76rem;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-b{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:.74rem;font-weight:600;line-height:22px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.brand-info{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:.85rem;padding:2px 2px 16px}
.brand-info span{display:inline-flex;align-items:center;gap:7px}
.brand-info svg{width:15px;height:15px;stroke:var(--red2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* zoeken + categorie */
.filters{position:sticky;top:var(--top);z-index:20;background:rgba(10,10,11,.94);backdrop-filter:blur(10px);margin:0 -32px;padding:10px 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:10px 14px 10px 38px;outline:none;transition:.15s}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.2)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:none;font-size:.82rem;font-weight:500;padding:6px 13px;border:1px solid var(--line2);border-radius:99px;color:var(--dim);white-space:nowrap;transition:.15s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.chip.on{background:#fff;color:#000;border-color:#fff}

/* productlijst */
.group-h{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--dim);margin:24px 0 8px;display:flex;align-items:center;gap:12px}
.group-h::after{content:'';flex:1;height:1px;background:var(--line)}
.plist{border-bottom:1px solid var(--line)}
.phead,.prow{display:grid;grid-template-columns:56px minmax(0,1fr) 100px 142px 100px;align-items:center;gap:6px 16px;padding:0 14px 0 10px}
.phead{padding-top:8px;padding-bottom:8px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-family:var(--font-ui);font-weight:700;border-bottom:1px solid var(--line)}
.phead span:nth-child(n+3){text-align:right}
.prow{padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);transition:background .15s}
.prow:last-child{border-bottom:none}
.prow:hover{background:rgba(255,255,255,.03)}
.prow.in{background:rgba(214,180,90,.07)}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--tone,#2a2a2e);display:grid;place-items:center;overflow:hidden;position:relative;margin-left:2px}
.thumb img{width:100%;height:100%;object-fit:contain;padding:3px;position:relative;z-index:1}
.thumb svg{width:22px;height:22px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.p-name{font-weight:500;line-height:1.25;font-size:.92rem}
.p-sku{color:var(--faint);font-size:.72rem;margin-top:1px;letter-spacing:.02em}
.p-price{text-align:right;color:var(--gold);font-size:.92rem;white-space:nowrap}
.p-price small{display:none;color:var(--faint);font-size:.74rem}
.p-act{display:flex;justify-content:flex-end}
.p-sum{text-align:right;color:var(--dim);font-size:.92rem;white-space:nowrap}
.prow.in .p-sum{color:var(--text);font-weight:600}
.empty{padding:50px 10px;text-align:center;color:var(--dim)}
.spin{width:28px;height:28px;margin:0 auto 14px;border:3px solid rgba(192,57,43,.25);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.step{display:inline-flex;align-items:stretch;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--bg)}
.step button{width:32px;font-size:1.25rem;line-height:1;color:var(--dim);transition:.15s}
.step button:hover{background:var(--red);color:#fff}
.step input{width:44px;text-align:center;background:transparent;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);outline:none;font-weight:600;-moz-appearance:textfield;padding:8px 0}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:focus{background:rgba(255,255,255,.06)}
.empty{padding:50px 10px;text-align:center;color:var(--dim)}
.spin{width:28px;height:28px;margin:0 auto 14px;border:3px solid rgba(192,57,43,.25);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── WINKELMAND ── */
.cart{position:sticky;top:var(--top);height:calc(100vh - var(--top));border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.cart-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px}
.cart-h h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.5rem;line-height:1}
.cart-h small{color:var(--faint);font-size:.82rem;margin-left:8px;font-family:var(--font-body);font-weight:400;text-transform:none}
.cart-close{display:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);font-size:1.2rem;line-height:1}
.cart-body{flex:1;overflow-y:auto;padding:0 22px 8px}
.cart-empty{color:var(--dim);padding:34px 8px;text-align:center}
.cart-empty svg{display:block;margin:0 auto 12px;width:34px;height:34px;stroke:var(--faint);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cbrand{margin:6px 0 14px;padding:12px 14px 4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.cbrand-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cbrand-n{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.cbrand-s{color:var(--dim);font-size:.86rem;font-weight:600}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:9px 0 3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .25s}
.meter.ok i{background:var(--ok)}
.meter-t{font-size:.78rem;color:var(--faint);margin-bottom:4px}
.meter-t.ok{color:var(--ok)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line)}
.line-n{font-size:.9rem;font-weight:500;line-height:1.3}
.line-t{font-weight:600;text-align:right;white-space:nowrap;font-size:.92rem}
.line .step{border-color:var(--line2)}
.line .step button{width:28px;font-size:1rem}.line .step input{width:38px;padding:5px 0;font-size:.88rem}
.line-sub{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:.8rem}
.line-x{color:var(--faint);font-size:.78rem;text-decoration:underline;padding:0}.line-x:hover{color:var(--red2)}
.line.dep{color:var(--dim);font-size:.85rem}.line.dep .line-n{font-weight:400;font-size:.85rem}.line.dep .line-t{font-weight:500;font-size:.85rem}
.warn{margin:0 0 10px;padding:9px 12px;border-radius:6px;background:rgba(192,57,43,.14);border:1px solid rgba(231,76,60,.4);color:#ffb4aa;font-size:.84rem}
.cart-foot{border-top:1px solid var(--line);padding:14px 22px 20px;background:var(--panel2)}
.dtl{margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.dtl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:.88rem;font-weight:600}
.dtl summary::-webkit-details-marker{display:none}
.dtl summary span{color:var(--faint);font-weight:400;font-size:.78rem}
.dtl summary::after{content:'+';color:var(--dim);font-size:1.1rem;margin-left:10px}
.dtl[open] summary::after{content:'−'}
.dtl-b{padding:2px 12px 12px}
.f-lab{display:block;font-size:.78rem;font-weight:600;color:var(--dim);margin:0 0 5px}
.f-in{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:9px 11px;outline:none;font-size:.9rem;transition:.15s;color-scheme:dark}
.f-in:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.2)}
textarea.f-in{resize:vertical;min-height:54px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.f-full{margin-bottom:10px}
.sumrow{display:flex;justify-content:space-between;color:var(--dim);font-size:.86rem;margin-top:4px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px}
.total strong{font-family:var(--font-display);font-size:2rem;font-weight:800;line-height:1}
.total span{font-weight:600}
.vat{color:var(--faint);font-size:.76rem;margin-bottom:12px}
.btn-red{width:100%;font-family:var(--font-ui);font-weight:700;font-size:.92rem;letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:#fff;padding:15px;border-radius:6px;transition:.15s}
.btn-red:hover:not(:disabled){background:var(--red2)}
.btn-red:disabled{opacity:.45;cursor:not-allowed}
.btn-line{width:100%;font-family:var(--font-ui);font-weight:700;font-size:.84rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line2);padding:12px;border-radius:6px;color:var(--dim);transition:.15s;margin-top:8px}
.btn-line:hover{color:#fff;border-color:rgba(255,255,255,.5)}

.done{padding:34px 22px;text-align:center}
.done-ic{width:58px;height:58px;border-radius:50%;background:rgba(63,178,127,.15);border:1px solid rgba(63,178,127,.5);margin:0 auto 16px;display:grid;place-items:center}
.done-ic svg{width:28px;height:28px;stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.7rem;line-height:1.05;margin-bottom:8px}
.done p{color:var(--dim);margin-bottom:6px}
.done .oid{font-family:var(--font-ui);font-weight:700;letter-spacing:.14em;color:#fff;font-size:1.05rem;margin:10px 0 18px;display:block}

/* mobiele winkelmandbalk */
.cartbar{display:none}

/* ── LIJSTEN (bestellingen / account) ── */
.pad{padding:26px 28px 90px;max-width:980px}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
.ord-h{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;align-items:center;padding:16px 18px;width:100%;text-align:left}
.ord-h:hover{background:rgba(255,255,255,.03)}
.ord-id{font-family:var(--font-ui);font-weight:700;letter-spacing:.1em}
.ord-meta{color:var(--dim);font-size:.84rem}
.ord-tot{font-family:var(--font-display);font-weight:700;font-size:1.3rem}
.pill{font-family:var(--font-ui);font-weight:700;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(63,178,127,.14);color:var(--ok);border:1px solid rgba(63,178,127,.4)}
.ord-d{border-top:1px solid var(--line);padding:6px 18px 16px}
.ord-d table{width:100%;border-collapse:collapse;font-size:.9rem}
.ord-d td,.ord-d th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.ord-d th{font-family:var(--font-ui);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.ord-d td.r,.ord-d th.r{text-align:right}
.ord-note{color:var(--dim);font-size:.86rem;margin:12px 0 0}
.ord-act{margin-top:14px;display:flex;gap:10px}
.ord-act .btn-red,.ord-act .btn-line{width:auto;padding:10px 18px;margin:0}
.acc-card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:6px;padding:22px 24px;margin-bottom:14px}
.acc-card h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:1.6rem;line-height:1.05}
.acc-card .sub{font-family:var(--font-ui);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);margin:4px 0 14px}
dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr}
dt,dd{padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
dt{font-family:var(--font-ui);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-right:14px;padding-top:12px}
dd{word-break:break-word}
dl>:nth-child(1),dl>:nth-child(2){border-top:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#fff;color:#000;padding:11px 18px;border-radius:4px;font-weight:600;font-size:.9rem;z-index:200;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--dim)}

/* ── RESPONSIVE ── */
@media(max-width:1180px){:root{--cart:340px}}
@media(max-width:1000px){
  :root{--side:0px}
  .shell{display:block;padding-bottom:64px}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:62px;width:100%;flex-direction:row;padding:0;border-right:none;border-top:1px solid var(--line);background:rgba(10,10,11,.96);backdrop-filter:blur(14px);z-index:60;gap:0}
  .side-foot{display:none}
  .nav-i{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 4px;font-size:.66rem;letter-spacing:.08em;border-radius:0;text-align:center}
  .nav-i.on{box-shadow:inset 0 3px 0 var(--red);background:rgba(192,57,43,.12)}

      const naam = (b.velden.find(v => /^(naam|filiaal ?naam|bedrijfsnaam|winkel)/i.test(v.label)) || {}).waarde;
      box.append(h('div', { class:'acc-card' },
        h('h2', { text:naam || (t('account.branch') + ' ' + f.filiaalId) }),
        h('div', { class:'sub', text:t('account.id') + ' ' + f.filiaalId }),
        h('dl', {}, b.velden.flatMap(v => [h('dt', { text:v.label }), h('dd', { text:v.waarde })]))));   // textContent: nooit HTML uit de sheet uitvoeren
    });
  });
}

/* ═══════════ TAAL + OPSTART ═══════════ */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  if (S.catalog) { renderBrands(); renderChips(); renderProducts(); renderCart(); renderAccount(); if (S.orders) renderOrders(); }
}

(async function init(){
  applyLang();
  try {
    const [cat, me] = await Promise.all([api('/api/klant/catalog'), api('/api/klant/me')]);
    S.catalog = cat; S.klant = me.klant;
    cat.brands.forEach(b => b.items.forEach(i => S.items.set(i.id, Object.assign({}, i, { brandId:b.id, brandName:b.name }))));
    S.brandId = cat.brands[0].id;
    Object.keys(S.cart).forEach(id => { if (!S.items.has(id)) delete S.cart[id]; });
    $('boot').classList.add('hidden');
    applyLang(); show('order');
  } catch (e) {
    if (e.message === '401') return;
    $('boot').replaceChildren(h('div', { style:'text-align:center' },
      h('p', { text:(e instanceof TypeError ? t('err.network') : t('err.load') + ' ' + e.message), style:'margin-bottom:14px' }),
      h('button', { class:'btn-ghost', text:t('err.retry'), onclick:() => location.reload() })));
  }
})();
</script>
